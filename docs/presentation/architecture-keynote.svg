<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><title>Tandem architecture — presentation view</title><desc>Startup validates and encodes the CSV, mines Apriori association rules, and retains catalog and rules in memory. Next.js requests catalog and recommendations from FastAPI, which matches the entire basket against stored rules.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#8B8882" stroke-width="1.5"/></marker></defs>
