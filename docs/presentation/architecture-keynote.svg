<path d="M1165 193 L1185 193" stroke="#8B8882" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="96" y="151" font-family="Helvetica Neue,Arial,sans-serif" font-size="29" fill="#242320" font-weight="600">Purchase history</text>
<text x="96" y="198" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" fill="#6C6963" font-weight="400">1,000 transactions</text>
<text x="96" y="238" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" fill="#6C6963" font-weight="400">40 products · CSV</text>
