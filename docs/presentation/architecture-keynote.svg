<text x="1060" y="62" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" fill="#6C6963" font-weight="400">Once per backend instance</text>
<rect x="70" y="100" width="335" height="185" rx="24" fill="#FFFFFF" stroke="#E5E2DC"/>
