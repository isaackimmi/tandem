<text x="846" y="238" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" fill="#6C6963" font-weight="400">Association rules</text>
<text x="1221" y="151" font-family="Helvetica Neue,Arial,sans-serif" font-size="29" fill="#242320" font-weight="600">In memory</text>
