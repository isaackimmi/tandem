name: Tandem checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tandem-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      API_ORIGIN: http://127.0.0.1:8001
      NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix client ci
          python -m venv server/.venv
          server/.venv/bin/python -m pip install -r server/requirements.txt
          npx playwright install --with-deps --no-shell chromium
      - name: Backend tests
        run: npm run test:backend
      - name: Frontend lint and typecheck
        run: |
          npm --prefix client run lint
          npm run typecheck
      - name: Production build without a backend
        run: npm run build
      - name: Browser acceptance and MP4 verification
        run: npm run test:e2e
      - name: Upload MP4 evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-results/**/*.mp4
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.json
            test-results/**/*.md
            !test-results/**/*.webm
